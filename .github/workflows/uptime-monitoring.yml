
name: Render Uptime Monitoring

on:
  schedule:
    # Avoid the top of the hour, when GitHub documents higher schedule load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uptime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Render website availability
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          URL="https://event-management-system-cqxx.onrender.com/health/ready/"
          set +e
          python scripts/collect_uptime_check.py \
            --url "$URL" \
            --timeout 120 \
            --run-id "$RUN_ID" \
            --event "$TRIGGER_EVENT" \
            --output uptime-results/check.csv > uptime-results/collector.log 2>&1
          COLLECTOR_STATUS=$?
          set -e
          cat uptime-results/collector.log
          cat uptime-results/collector.log >> "$GITHUB_STEP_SUMMARY"
          exit "$COLLECTOR_STATUS"

      - name: Archive uptime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uptime-check-${{ github.run_id }}
          path: uptime-results/
          if-no-files-found: ignore
          retention-days: 35
