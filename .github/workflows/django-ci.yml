
name: Django CI and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  django-tests:
    runs-on: ubuntu-latest

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-test-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run tests with branch coverage
        run: python -m coverage run manage.py test

      - name: Display coverage report
        run: python -m coverage report -m

      - name: Generate HTML and XML reports
        run: |
          python -m coverage html
          python -m coverage xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: django-coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14
